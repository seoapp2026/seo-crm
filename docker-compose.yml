services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seo_crm
      POSTGRES_PASSWORD: seo_crm_dev
      POSTGRES_DB: seo_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_crm -d seo_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: