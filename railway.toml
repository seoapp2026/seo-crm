# Monorepo: one Railway service builds frontend + backend together.
# Any push to the connected branch redeploys the full app.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "frontend/**", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5