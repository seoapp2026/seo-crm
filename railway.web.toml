# Railway config for the frontend service (e.g. seo-crm.up.railway.app)
# Dashboard → Web service → Settings → set Config file path: railway.web.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"
watchPatterns = ["frontend/**", "deploy/**", "Dockerfile.web", "railway.web.toml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5